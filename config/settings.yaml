# Network Attack Forecasting - Configuration
# Tuned for ASUS TUF Gaming F17 (16GB RAM, 4GB VRAM)

environment:
  log_level: "INFO"
  seed: 42
  device: "cpu" # Set to 'cuda' if GPU enabled, 'cpu' for portable test

telemetry:
  window_size_sec: 1.0          # Time window duration for feature aggregation
  slide_step_sec: 1.0           # Non-overlapping or sliding step
  flow_timeout_sec: 15.0        # Flow expiration threshold
  max_active_flows: 10000       # Memory guard for tracking table

features:
  # Flow-level features (12 features)
  flow_features:
    - "flow_duration_ms"
    - "total_fwd_packets"
    - "total_bwd_packets"
    - "total_fwd_bytes"
    - "total_bwd_bytes"
    - "packet_length_mean"
    - "packet_length_std"
    - "iat_mean_ms"
    - "iat_std_ms"
    - "fwd_bwd_byte_ratio"
    - "active_flows_count"
    - "unique_dst_ports"
  # Packet-level features (10 features)
  packet_features:
    - "ttl_mean"
    - "ttl_variance"
    - "tcp_win_mean"
    - "tcp_win_min"
    - "flag_syn_ratio"
    - "flag_ack_ratio"
    - "flag_fin_ratio"
    - "flag_rst_ratio"
    - "fragment_flag_count"
    - "retransmission_count"

model:
  name: "SmallWorldModelLSTM"
  input_dim: 22                 # 12 flow + 10 packet features
  hidden_dim: 64                # Fits well within 4GB VRAM (< 100K params)
  num_layers: 2
  sequence_length: 10           # Lookback window (10 seconds)
  rollout_steps_k: 5            # Forward simulation rollout horizon (5 steps)
  dropout: 0.2
  learning_rate: 0.001
  batch_size: 32
  max_epochs: 20
  weight_decay: 1e-4
  saved_weights_path: "model/saved/world_model.pt"
  scaler_path: "model/saved/scaler.pkl"
  baseline_weights_path: "model/saved/baseline_lr.pkl"

mitre_mapping:
  alert_threshold: 0.75         # Calibrated Bayes-optimal threshold for infiltration alert (FPR 12.8%, Recall 82.0%)
  persistence_windows: 2        # Consecutive windows required to escalate incident alert in SOC (drops effective FPR to 1.6%)
  thresholds:
    reconnaissance: 0.35
    initial_access: 0.50
    lateral_movement: 0.65
    c2: 0.75
    exfiltration: 0.85

streaming:
  redis_host: "localhost"
  redis_port: 6379
  stream_key: "network:telemetry:windows"
  group_name: "soc_inference_group"
  consumer_name: "inference_worker_1"

database:
  path: "data/predictions.db"

serving:
  host: "0.0.0.0"
  port: 8000
  ws_endpoint: "/ws/live"
